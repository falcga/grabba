repos:
  - repo: local
    hooks:
      - id: grabba-pre-commit
        name: Grabba - Entropy Analysis
        description: Проверка на наличие секретов через энтропийный анализ
        entry: make pre-commit
        language: system
        types: [file]
        pass_filenames: false
        stages: [pre-commit]
        verbose: true

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=1024']
      - id: detect-private-key
      - id: check-merge-conflict

  - repo: https://github.com/dnephin/pre-commit-golang
    rev: v0.5.1
    hooks:
      - id: go-fmt
      - id: go-mod-tidy
      - id: golangci-lint
